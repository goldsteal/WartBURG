# WartBURG release grub.cfg (Secure Boot).
# Every module referenced here is EMBEDDED in the signed grubx64.efi — under
# Secure Boot grub refuses to insmod unsigned modules from disk, so the lines
# below are no-ops against already-loaded modules (kept for clarity/portability).
loadfont ($root)/boot/grub/fonts/unicode.pf2
insmod gfxterm
terminal_output gfxterm

insmod wartburg
set theme=wartburg

set timeout=30
set default=0

menuentry "Arch Linux" { set _dummy=1 }
menuentry "Windows 11" { set _dummy=1 }
menuentry "Recovery Shell" { set _dummy=1 }
menuentry "Power Off" { halt }
menuentry "Reboot" { reboot }
